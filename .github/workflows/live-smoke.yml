name: Live Render product
on:
  push:
    branches: [main]
    paths: ['.github/workflows/live-smoke.yml', 'release/verify-render.json', 'src/learning-lab.*', 'src/tutorials.mjs']
permissions:
  contents: read
jobs:
  live-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify deployed product without private credentials
        run: |
          for attempt in $(seq 1 60); do
            if curl --max-time 10 -fsS https://agenticsl-learning-hub.onrender.com/js/learning-lab.js | grep -q 'Your editable website preview' && ! curl --max-time 10 -fsS https://agenticsl-learning-hub.onrender.com/js/learning-lab.js | grep -q 'data-text-size'; then break; fi
            sleep 5
          done
          python scripts/smoke-spring.py https://agenticsl-learning-hub.onrender.com

