name: Spring product
on:
  push:
    branches: [main, product/spring-learning-hub]
  pull_request:
    paths: ['spring-app/**', 'Dockerfile', '.github/workflows/spring.yml']
permissions:
  contents: read
jobs:
  product:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: spring-app/pom.xml
      - name: Test and package Spring Boot product
        run: mvn -B -f spring-app/pom.xml verify
      - name: Verify published coding examples
        run: |
          node --check spring-app/src/main/resources/static/js/learning-lab.js
          node --check spring-app/src/main/resources/static/js/academic-lessons.js
          node --check spring-app/src/main/resources/static/js/visual-lectures-data.js
          node --check spring-app/src/main/resources/static/js/visual-lectures.js
          node scripts/verify-visual-lectures.cjs
          node --check spring-app/src/main/resources/static/js/tutorials.js
          python scripts/verify-tutorials.py
          python scripts/verify-academic.py
      - name: Exercise running product
        env:
          COOKIE_SECURE: 'false'
        run: |
          java -jar spring-app/target/learning-hub-1.0.0.jar > /tmp/agenticsl-smoke.log 2>&1 &
          APP_PID=$!
          trap 'kill "$APP_PID" || true' EXIT
          for attempt in $(seq 1 40); do
            if curl -fsS http://localhost:8080/actuator/health > /dev/null; then break; fi
            sleep 1
          done
          python scripts/smoke-spring.py http://localhost:8080 || { cat /tmp/agenticsl-smoke.log; exit 1; }
          node --check spring-app/src/main/resources/static/js/learning.js
      - uses: actions/upload-artifact@v4
        with:
          name: agenticsl-spring-product
          path: spring-app/target/learning-hub-1.0.0.jar
          if-no-files-found: error
          retention-days: 30
